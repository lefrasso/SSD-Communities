name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - preview/**
      - design-system/tokens.css
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/preview _site/design-system
          cp index.html _site/index.html
          cp preview/index.html preview/app.js preview/playbook.js preview/styles.css _site/preview/
          cp design-system/tokens.css _site/design-system/tokens.css
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4